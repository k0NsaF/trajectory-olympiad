services:
  - type: web
    name: trajectory-olympiad-api
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build --workspace=shared && npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_AI_MODEL
        value: openai/gpt-oss-120b
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_AI_MODEL
        value: '@cf/zai-org/glm-4.7-flash'
      - key: TAVILY_API_KEY
        sync: false
      - key: TAVILY_SEARCH_ENABLED
        value: "true"
